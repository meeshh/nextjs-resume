name: Reset Rate Limits

on:
  schedule:
    - cron: '0 0 * * *' # every day at midnight UTC
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest

    steps:
      - name: Reset all skill-highlighting limits
        env:
          # passed via env (not inlined into the script) so it can't break or inject into the shell command
          RESET_LIMIT_CODE: ${{ secrets.RESET_LIMIT_CODE }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Content-Type: application/json" \
            -d "{\"secret\": \"${RESET_LIMIT_CODE}\"}" \
            https://michel-barakat.vercel.app/api/rateLimiter
